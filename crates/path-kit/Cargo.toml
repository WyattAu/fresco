[package]
name = "path-kit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "2D geometry for the fresco UI engine: beziers, adaptive flattening, arc length, stroking, dashing, robust predicates"
keywords = ["geometry", "bezier", "graphics", "2d"]
categories = ["graphics", "mathematics"]
exclude = ["/target"]

[dependencies]

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "flatten"
harness = false

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
undocumented_unsafe_blocks = "deny"
