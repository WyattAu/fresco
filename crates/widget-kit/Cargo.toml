[package]
name = "widget-kit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Retained widget layer for the fresco UI engine: model, focus chain, input, a11y emission, renderer contract (Gate D spike)"
keywords = ["widgets", "ui", "gui", "accessibility", "retained-mode"]
categories = ["graphics", "gui"]
exclude = ["/target"]

[dependencies]
layout-kit = { workspace = true }
scene-kit = { workspace = true }
paint-kit = { workspace = true }
text-kit = { workspace = true }
theme-kit = "0.1.1"
color-kit = "0.1"
window-kit = { workspace = true }
a11y-kit = { git = "https://github.com/WyattAu/a11y-kit", version = "0.2.1" }
ui-text-edit = "0.1"

[features]
strip-renderer = ["paint-kit/sparse-strip"]
default = []
accesskit = ["dep:accesskit"]

[dependencies.accesskit]
version = "0.25"
optional = true

[dev-dependencies]
render-conformance = { path = "../render-conformance" }
ui-text-edit = "0.1"

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
