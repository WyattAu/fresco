[package]
name = "video-kit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Deterministic video export for the fresco stack: a timed frame loop over paint-kit surfaces with a BMP-sequence oracle sink; real output backends live behind default-off features"

keywords = ["video", "export", "animation", "render"]
categories = ["multimedia::video", "rendering::engine"]
exclude = ["/target"]

[lib]

[dependencies]
paint-kit = { workspace = true }

[features]
default = []
# External ffmpeg pipe backend (rawvideo stdin -> libx264). The oracle
# test skips gracefully when the ffmpeg binary is absent.
ffmpeg = []

[dev-dependencies]
audio-kit = { workspace = true }
scene-kit = { workspace = true }
widget-kit = { workspace = true }

[lints.rust]
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
