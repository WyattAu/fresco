[package]
name = "scene-kit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Retained scene graph for the fresco UI engine: generational arena, damage tracking, frame plans, sorted draw lists"
keywords = ["scene-graph", "ui", "damage-tracking", "retained-mode"]
categories = ["graphics"]
exclude = ["/target"]

[dependencies]
path-kit = { workspace = true }

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
