[package]
name = "fresco-layout-kit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Incremental layout for the fresco UI engine: memoized measure caches and a single-axis flex solver"
keywords = ["layout", "flexbox", "ui", "incremental"]
categories = ["graphics", "no-std"]
exclude = ["/target"]

[features]
taffy = ["dep:taffy"]

[dependencies]
taffy = { version = "0.7", optional = true, default-features = false, features = ["std", "taffy_tree", "flexbox"] }

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

[lib]
name = "layout_kit"
