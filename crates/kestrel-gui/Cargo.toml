[package]
name = "kestrel-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Kestrel GUI: the estate's consumer application shell, bootstrapped on the fresco UI stack (widget-kit retained widgets, window-kit window facade, paint-kit raster)"

keywords = ["gui", "ui", "widgets"]
exclude = ["/target"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
winit = "0.30"
softbuffer = "0.4"
paint-kit = { workspace = true }
widget-kit = { workspace = true }
window-kit = { workspace = true }
path-kit = { workspace = true }
fresco-game = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30", features = ["android-native-activity"] }
android-activity = "0.6"

[package.metadata.android]
package = "com.example.kestrel_gui"
apk_name = "kestrel-gui"

[package.metadata.android.application]
label = "kestrel"

[package.metadata.android.application.activity]
orientation = "portrait"
theme = "@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen"

[lints.rust]
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
