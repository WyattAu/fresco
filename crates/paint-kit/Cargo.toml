[package]
name = "paint-kit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "CPU rasterization for the fresco UI engine: exact-coverage scanline fill, premultiplied RGBA8 surfaces"
keywords = ["rasterizer", "graphics", "2d", "rendering", "antialiasing"]
categories = ["graphics", "rendering"]
exclude = ["/target"]

[dependencies]
path-kit = { workspace = true }
vello_cpu = { version = "0.2", optional = true }

[features]
default = []
sparse-strip = ["dep:vello_cpu"]

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
