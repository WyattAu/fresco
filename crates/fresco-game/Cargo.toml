[package]
name = "fresco-game"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Phase B game demo for the fresco UI engine: ecs-kit entities + phys-kit dynamics + widget HUD in one game loop, desktop and Android shells, full observability"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
winit = { version = "0.30" }
paint-kit = { workspace = true }
widget-kit = { workspace = true }
window-kit = { workspace = true }
path-kit = { workspace = true }
ecs-kit = { workspace = true }
phys-kit = { workspace = true }
softbuffer = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30", features = ["android-native-activity"] }
android-activity = "0.6"

[lints.rust]
missing_docs = "deny"
# The NativeActivity entry (android_main) requires #[unsafe(no_mangle)]
# in edition 2024 - the FFI shell is the one sanctioned unsafe surface;
# all inner modules stay safe.
unsafe_code = "allow"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

[package.metadata.android]
package = "com.example.fresco_game"
apk_name = "fresco-game"

[package.metadata.android.application]
label = "fresco game"

[package.metadata.android.application.activity]
orientation = "portrait"
theme = "@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen"
